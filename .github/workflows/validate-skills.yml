name: Validate Skills

# Catalog, generated output, playbooks, router, trace scenarios and unit tests.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check catalog (validators and drift rebuild)
        run: node scripts/skills.mjs check

      - name: Router eval
        run: node scripts/skills.mjs eval --router

      - name: Unit tests
        run: node --test scripts/test/

      - name: Trace scenario validation
        run: node scripts/skills.mjs eval --trace all

name: Validate Skills

# Design §5.11: validators V1-V17 + V19, the V15 drift rebuild, the router eval (100 % gate) and unit tests.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check catalog (validators and drift rebuild)
        run: node scripts/skills.mjs check

      - name: Router eval
        run: node scripts/skills.mjs eval --router

      - name: Unit tests
        run: node --test scripts/test/
